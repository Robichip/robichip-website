name: Deploy RobiChip website to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      website_version:
        description: Choose which website branch to deploy
        required: true
        default: elfsight-version
        type: choice
        options:
          - elfsight-version
          - flowring-version

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected website version
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.website_version }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
