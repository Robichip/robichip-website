<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RobiChip at SEMICON Taiwan 2026</title>
  <style>
    :root {
      --ink: #10131a;
      --muted: #636977;
      --paper: #f7f7f9;
      --white: #ffffff;
      --pink: #c62470;
      --pink-2: #ed5aa0;
      --purple: #5a38b5;
      --violet: #8f66ff;
      --cyan: #67e8f9;
      --line: rgba(255,255,255,.16);
      --shadow: 0 24px 70px rgba(28,15,60,.18);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: Inter, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      line-height: 1.6;
    }
    a { color: inherit; }
    .page { overflow: hidden; }
    .wrap { width: min(1180px, calc(100% - 40px)); margin: 0 auto; }

    .hero {
      position: relative;
      min-height: 760px;
      display: grid;
      align-items: center;
      color: var(--white);
      background:
        radial-gradient(circle at 78% 30%, rgba(103,232,249,.28), transparent 22%),
        radial-gradient(circle at 15% 75%, rgba(237,90,160,.38), transparent 30%),
        linear-gradient(135deg, #23105e 0%, #4a1e86 44%, #c62470 100%);
    }
    .hero::before {
      content: "";
      position: absolute; inset: 0;
      opacity: .3;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: linear-gradient(to bottom, #000, transparent 86%);
    }
    .hero-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1.18fr .82fr;
      gap: 64px;
      align-items: center;
      padding: 80px 0 72px;
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 8px 13px;
      border: 1px solid rgba(255,255,255,.32);
      border-radius: 999px;
      background: rgba(255,255,255,.1);
      backdrop-filter: blur(12px);
      font-size: 12px; font-weight: 800; letter-spacing: .12em;
      text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 18px var(--cyan); }
    h1 { margin: 24px 0 22px; font-size: clamp(48px, 6.4vw, 86px); line-height: .98; letter-spacing: -.055em; }
    h1 span { display: block; color: #f7b7d4; }
    .lead { max-width: 700px; margin: 0; font-size: clamp(18px, 2.1vw, 25px); color: rgba(255,255,255,.84); }
    .hero-meta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
    .meta-pill { padding: 12px 15px; border-radius: 14px; background: rgba(8,8,25,.24); border: 1px solid rgba(255,255,255,.18); font-size: 14px; }

    .chip-stage { position: relative; min-height: 500px; display: grid; place-items: center; }
    .soc-hero-image {
      position: relative;
      z-index: 2;
      display: block;
      width: min(610px, 100%);
      height: auto;
      border-radius: 28px;
      border: 8px solid rgba(255,255,255,.78);
      background: #fff;
      box-shadow: var(--shadow), 0 0 0 1px rgba(255,255,255,.26);
      transform: rotate(1deg);
    }
    .orbit { position: absolute; inset: 5%; border: 1px solid rgba(255,255,255,.18); border-radius: 50%; transform: rotate(-12deg); }
    .orbit.two { inset: 17%; transform: rotate(18deg); }
    .chip {
      position: relative;
      width: min(360px, 78vw); aspect-ratio: 1;
      border-radius: 44px;
      display: grid; place-items: center;
      color: #1b1234;
      background: linear-gradient(145deg, #fff, #d8d2ef);
      border: 12px solid rgba(255,255,255,.24);
      box-shadow: var(--shadow), inset 0 0 0 1px rgba(30,20,70,.15);
      transform: rotate(8deg);
    }
    .chip::before, .chip::after { content: ""; position: absolute; inset: -22px; border-radius: 52px; border: 2px solid rgba(103,232,249,.55); }
    .chip::after { inset: 30px; border-color: rgba(198,36,112,.28); }
    .chip-core { transform: rotate(-8deg); text-align: center; }
    .chip-core strong { display: block; font-size: clamp(44px, 5vw, 72px); line-height: 1; letter-spacing: -.06em; }
    .chip-core small { display: block; margin-top: 12px; color: #5d5473; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; }
    .pin { position: absolute; width: 9px; height: 34px; border-radius: 6px; background: linear-gradient(#f7dd99,#ba7c25); }
    .pin.t { top: -38px; } .pin.b { bottom: -38px; }
    .pin.l { left: -25px; transform: rotate(90deg); } .pin.r { right: -25px; transform: rotate(90deg); }
    .p1 { left: 22%; } .p2 { left: 48%; } .p3 { left: 74%; }
    .p4 { top: 22%; } .p5 { top: 48%; } .p6 { top: 74%; }

    .section { padding: 96px 0; }
    .section.dark { color: var(--white); background: #11101a; }
    .section-kicker { margin: 0 0 10px; color: var(--pink); font-weight: 900; letter-spacing: .14em; text-transform: uppercase; font-size: 12px; }
    .dark .section-kicker { color: #f48dbc; }
    h2 { margin: 0 0 18px; font-size: clamp(36px, 5vw, 62px); line-height: 1.05; letter-spacing: -.045em; }
    .section-intro { max-width: 820px; margin: 0 0 44px; color: var(--muted); font-size: 19px; }
    .dark .section-intro { color: #b9b7c4; }

    .flow {
      display: grid; grid-template-columns: repeat(4,1fr); gap: 16px;
      position: relative;
    }
    .flow::before { content:""; position:absolute; left: 8%; right: 8%; top: 44px; height: 2px; background: linear-gradient(90deg,var(--purple),var(--pink),var(--cyan)); }
    .flow-card { position: relative; z-index: 1; min-height: 215px; padding: 25px; border-radius: 24px; background: var(--white); border: 1px solid #e7e4ee; box-shadow: 0 18px 50px rgba(42,30,80,.08); }
    .flow-num { display: grid; place-items:center; width: 42px; height:42px; margin-bottom: 42px; border-radius: 50%; color:#fff; background: linear-gradient(135deg,var(--purple),var(--pink)); font-weight:900; box-shadow: 0 0 0 8px var(--paper); }
    .flow-card h3 { margin: 0 0 7px; font-size: 20px; }
    .flow-card p { margin: 0; color: var(--muted); font-size: 14px; }

    .architecture { display:grid; grid-template-columns: .86fr 1.14fr; gap: 52px; align-items:center; }
    .stack { display:grid; gap: 12px; }
    .layer { position:relative; padding: 17px 20px 17px 58px; border:1px solid rgba(255,255,255,.13); border-radius:16px; background: linear-gradient(90deg,rgba(255,255,255,.09),rgba(255,255,255,.025)); }
    .layer::before { content:""; position:absolute; left:20px; top:50%; width:22px; height:22px; transform:translateY(-50%); border-radius:7px; background:linear-gradient(135deg,var(--cyan),var(--violet)); }
    .layer b { display:block; font-size:16px; }
    .layer span { color:#aaa7b7; font-size:13px; }
    .spec-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-top:30px; }
    .spec { padding:22px; border-radius:20px; background:rgba(255,255,255,.065); border:1px solid rgba(255,255,255,.1); }
    .spec strong { display:block; font-size:31px; color:#fff; letter-spacing:-.04em; }
    .spec span { color:#aaa7b7; font-size:13px; }

    .metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
    .metric { min-height:230px; padding:26px; border-radius:24px; color:#fff; background: linear-gradient(150deg,#5425a1,#bf246f); box-shadow: 0 22px 55px rgba(109,36,139,.22); }
    .metric:nth-child(2) { background:linear-gradient(150deg,#122243,#3566aa); }
    .metric:nth-child(3) { background:linear-gradient(150deg,#7f1949,#e05083); }
    .metric:nth-child(4) { background:linear-gradient(150deg,#173e4e,#16869c); }
    .metric small { display:block; min-height:48px; color:rgba(255,255,255,.76); font-size:12px; text-transform:uppercase; letter-spacing:.1em; }
    .metric strong { display:block; margin:14px 0 2px; font-size:clamp(38px,4vw,56px); line-height:1; letter-spacing:-.055em; }
    .metric p { margin:12px 0 0; font-size:14px; color:rgba(255,255,255,.8); }
    .proof-note { margin-top:22px; padding:15px 18px; border-left:4px solid var(--pink); background:#fff; color:#5f6270; font-size:13px; }

    .maturity { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
    .m-card { padding:26px; border-radius:24px; border:1px solid #e3dfec; background:#fff; }
    .tag { display:inline-flex; padding:6px 10px; border-radius:999px; color:#fff; background:#1d9b6c; font-size:11px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; }
    .tag.plan { background:#716982; } .tag.proto { background:#6240be; }
    .m-card h3 { margin:18px 0 6px; font-size:26px; letter-spacing:-.03em; }
    .m-card p { margin:0; color:var(--muted); font-size:15px; }

    .cta { position:relative; padding:92px 0; color:#fff; background:linear-gradient(125deg,#24105c,#7b218c 50%,#c62470); }
    .cta::after { content:""; position:absolute; inset:0; background:radial-gradient(circle at 85% 20%,rgba(103,232,249,.22),transparent 24%); pointer-events:none; }
    .cta-grid { position:relative; z-index:1; display:grid; grid-template-columns:1fr auto; gap:42px; align-items:center; }
    .cta h2 { max-width:780px; margin-bottom:16px; }
    .cta p { max-width:760px; margin:0; color:rgba(255,255,255,.8); }
    .btn { display:inline-flex; align-items:center; justify-content:center; min-width:240px; padding:17px 22px; border-radius:999px; background:#fff; color:#47186f; font-weight:900; text-decoration:none; box-shadow:0 16px 38px rgba(0,0,0,.22); transition:.2s ease; }
    .btn:hover { transform:translateY(-2px); box-shadow:0 20px 44px rgba(0,0,0,.3); }
    .partner-line { margin-top:28px; padding-top:24px; border-top:1px solid rgba(255,255,255,.18); font-size:13px; color:rgba(255,255,255,.64); }

    @media (max-width: 900px) {
      .hero { min-height: auto; }
      .hero-grid, .architecture, .cta-grid { grid-template-columns:1fr; }
      .chip-stage { min-height:430px; }
      .flow, .metrics { grid-template-columns:repeat(2,1fr); }
      .maturity { grid-template-columns:1fr; }
      .cta-grid { align-items:start; }
      .btn { width:100%; }
    }
    @media (max-width: 560px) {
      .wrap { width:min(100% - 28px,1180px); }
      .hero-grid { padding:52px 0; gap:18px; overflow:hidden; }
      .eyebrow { font-size:10px; letter-spacing:.08em; }
      h1 { font-size:36px; line-height:1.02; overflow-wrap:anywhere; }
      .lead { font-size:16px; }
      .hero-meta { flex-direction:column; align-items:stretch; }
      .chip-stage { display:grid; min-height:auto; margin-top:10px; }
      .soc-hero-image { width:100%; border-width:4px; border-radius:16px; transform:none; }
      .chip { border-radius:32px; }
      .section { padding:68px 0; }
      .flow, .metrics, .spec-grid { grid-template-columns:1fr; }
      .flow::before { display:none; }
      .flow-num { margin-bottom:24px; box-shadow:none; }
      .metric { min-height:190px; }
    }
  </style>
</head>
